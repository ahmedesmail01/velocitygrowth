name: velocitygrowth
services:
  web:
    image: ghcr.io/ahmedesmail01/velocitygrowth-web:${VERSION:?Set VERSION to a full commit SHA}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  worker:
    image: ghcr.io/ahmedesmail01/velocitygrowth-worker:${VERSION:?Set VERSION to a full commit SHA}
    restart: unless-stopped
    init: true
    env_file:
      - /etc/velocitygrowth/worker.env
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
